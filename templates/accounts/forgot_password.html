{% extends 'base.html' %}
{% load static %}

{% block title %}Recover Password - MindBridge{% endblock %}

{% block content %}
<div class="container auth-shell">
  <div class="auth-card mb-card p-4 p-md-5" style="max-width: 460px;">
    <div class="text-center mb-4">
      <span class="auth-icon" aria-hidden="true"><i class="bi bi-envelope-check-fill"></i></span>
      <h1 class="h4 fw-bold mb-1">Password recovery</h1>
      <p class="text-muted small mb-0">Enter your account email to receive a password reset link.</p>
    </div>

    <form method="POST" data-loading-label="Sending link…">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="recoveryEmail">Registered email address</label>
        <input type="email" id="recoveryEmail" name="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
      </div>

      <button type="submit" class="btn btn-primary-mb w-100 py-2 fw-bold">Send reset link</button>

      <div class="auth-meta">
        <span>Remembered it?</span>
        <a href="{% url 'accounts:login' %}">Return to sign in</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
