{% extends 'base.html' %}
{% load static %}

{% block title %}Set New Password - MindBridge{% endblock %}

{% block content %}
<div class="container auth-shell">
  <div class="auth-card mb-card p-4 p-md-5" style="max-width: 460px;">
    <div class="text-center mb-4">
      <span class="auth-icon" aria-hidden="true"><i class="bi bi-key-fill"></i></span>
      <h1 class="h4 fw-bold mb-1">Set a new password</h1>
      <p class="text-muted small mb-0">Choose something strong and private to you.</p>
    </div>

    <form method="POST" data-loading-label="Updating…">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="newPassword">New password</label>
        <div class="password-wrap">
          <input type="password" id="newPassword" name="password" class="form-control" placeholder="Min 8 characters" required minlength="8" autocomplete="new-password">
          <button type="button" class="password-toggle" data-password-toggle aria-label="Show password">
            <i class="bi bi-eye" aria-hidden="true"></i>
          </button>
        </div>
        <div class="pw-strength" data-strength-for="newPassword" data-level="0">
          <div class="pw-strength-track"><div class="pw-strength-bar"></div></div>
          <span class="pw-strength-label">At least 8 characters</span>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="confirmPassword">Confirm new password</label>
        <div class="password-wrap">
          <input type="password" id="confirmPassword" name="confirm_password" class="form-control" placeholder="Repeat password" required minlength="8" autocomplete="new-password">
          <button type="button" class="password-toggle" data-password-toggle aria-label="Show password">
            <i class="bi bi-eye" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary-mb w-100 py-2 fw-bold">Update &amp; sign in</button>

      <div class="auth-meta">
        <span>Changed your mind?</span>
        <a href="{% url 'accounts:login' %}">Back to sign in</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
